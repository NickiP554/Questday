name: Build QuestDay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/emulator" >> $GITHUB_PATH

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platform-tools"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build QuestDay APK
        run: ./gradlew assembleDebug

      - name: Upload QuestDay APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestDay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
